name: Update LicenseManager

# Runs automatically when LicenseManager publishes a new release (via repository_dispatch),
# on a weekly schedule as a safety net, or manually.
#
# After updating it opens a PR so changes can be reviewed before merging.

on:
  repository_dispatch:
    types: [license-manager-released]   # triggered by LicenseManager repo via webhook

  schedule:
    - cron: '0 6 * * 1'                 # every Monday 06:00 UTC

  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version tag (e.g. v2025.Q4.200). Leave blank for latest.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update native LicenseManager binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run updater script
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.event.inputs.version }}"
          $params  = @{ GitHubToken = $env:GITHUB_TOKEN }
          if ($version) { $params['Version'] = $version }
          ./.github/scripts/Update-LicenseManager.ps1 @params

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Get installed version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: |
          # Read version from the lock-file written by the script
          VF=$(find . -name "license-manager.version" | head -1)
          if [ -f "$VF" ]; then
            echo "tag=$(cat $VF)" >> $GITHUB_OUTPUT
          else
            echo "tag=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token:          ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update LicenseManager to ${{ steps.version.outputs.tag }}"
          branch:         "chore/update-license-manager-${{ steps.version.outputs.tag }}"
          delete-branch:  true
          title:          "chore: update LicenseManager to ${{ steps.version.outputs.tag }}"
          body: |
            ## LicenseManager native library update

            Updated native binaries to **${{ steps.version.outputs.tag }}**.

            ### What changed
            - `runtimes/*/native/` — refreshed shared libraries for all 6 platforms
            - `license-manager.version` — lock-file bumped to ${{ steps.version.outputs.tag }}

            ### Platforms updated
            Path layout matches `LicenseManagerInterop.cs` `GetNativeLibRelativePath()`:

            | Platform | Runtimes folder | Library (interop name) |
            |---|---|---|
            | linux-x64 | `runtimes/linux-x64/native/` | `libLicenseManager.so` |
            | linux-arm64 | `runtimes/linux-arm64/native/` | `libLicenseManager.so` |
            | windows-x64 | `runtimes/win-x64/native/` | `LicenseManager.dll` |
            | windows-arm64 | `runtimes/win-arm64/native/` | `LicenseManager.dll` |
            | macos-x64 | `runtimes/macos-x64/native/` | `libLicenseManager.dylib` |
            | macos-arm64 | `runtimes/macos-arm64/native/` | `libLicenseManager.dylib` |

            The `ThunderPropagator.Application.csproj` glob `<None Include="runtimes\**\*.*" />` picks these up automatically — no `.csproj` changes required.

            > Auto-generated by the [Update LicenseManager](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.
          labels:         "dependencies,native"

      - name: No update needed
        if: steps.changes.outputs.changed == 'false'
        run: echo "Already up-to-date — no PR created."
